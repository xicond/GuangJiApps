name: APIsec University Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '28 17 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    permissions:
      security-events: write # untuk mengunggah hasil SARIF ke GitHub Security tab
      actions: read 
    runs-on: ubuntu-latest

    steps:
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: APIsec University Scan
         uses: apisec-university/free-API-security-test-action@beta # Sesuaikan versi tag/commit terbaru
         with:
           # Token khusus dari APIsec University
           apisecu_token: ${{ secrets.APISECU_TOKEN }}
           
           # Nama project target (misal: VAmPI)
           apisec-project: "VAmPI"
           
           # Output file format SARIF
           sarif-result-file: "apisec-results.sarif"

       - name: Import results to GitHub Security
         uses: github/codeql-action/upload-sarif@v3
         with:
           sarif_file: ./apisec-results.sarif


