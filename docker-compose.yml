services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=YourStrong@Passw0rd123
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
    restart: unless-stopped

  exporter:
    profiles: [ "tools" ]
    build: ./exporter
    container_name: mssql_exporter
    volumes:
      - ./backup:/backup
    depends_on:
      - mssql
    restart: "no"
    command: >
      /bin/sh -c "python ./export_to_sql.py"

  redis:
    image: redis:7-alpine
    container_name: redis_app
    ports:
      - "6379:6379"
    restart: unless-stopped

  gin:
    build:
      context: ./gin
      dockerfile: Dockerfile
    container_name: gin_app
    env_file:
      - ./gin/.env
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - BASE_URL=/
      - JWT_SECRET=/app/certs/dev-private-key.pem
      - REFRESH_SECRET=/app/certs/dev-private-key.pem
      # - DATABASE_DSN=sqlserver://sa:YourStrong@Passw0rd123@mssql:1433?database=master
      - REDIS_ADDR=redis:6379
    volumes:
      - ./gin/certs:/app/certs:ro
      - go-compiler-cache:/go-cache
      - go-modules-cache:/go-mod-cache
    ports:
      - "8080:8080"
    depends_on:
      - mssql
      - redis
    restart: unless-stopped
    # environment:
    #   - BASE_URL=/
    #   - DATABASE_DSN="server=mssql;port=1433;user id=sa;password=YourStrong@Passw0rd123;database=guangji;encrypt=disable;"

  gin-build:
    profiles: [ "build" ]
    image: golang:1.25.13-alpine3.24
    container_name: gin_build
    working_dir: /src
    environment:
      - GOCACHE=/go-cache
      - GOMODCACHE=/go-mod-cache
    volumes:
      - ./gin:/src
      - ./gin/dist:/out
      - go-compiler-cache:/go-cache
      - go-modules-cache:/go-mod-cache
      - ./gin/.env:/app/.env
      - ./gin/certs:/app/certs
    command: >
      /bin/sh -c " mkdir -p /out &&  GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags=\"-s -w\" -v -o /out/server.exe ./cmd/server "
    restart: "no"

  vue-dev:
    image: node:20-alpine
    container_name: vue_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./vue:/app
      - /app/node_modules
    command: >
      /bin/sh -c " npm install && npm run dev -- --host 0.0.0.0 "
    restart: unless-stopped

  # SERVICE STRESSTEST K6 (ON-DEMAND)
  k6:
    image: grafana/k6:latest
    container_name: chat_k6
    # profiles mencegah service ini jalan otomatis saat `docker compose up`
    profiles:
      - tools
    env_file:
      - ./vue/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    volumes:
      - ./vue:/app
    working_dir: /app
    command: run ./pentest.js
    #pentest.js #single_test.js
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.ip_local_port_range=1024 65535
      # - net.core.netdev_max_backlog=65535
      - net.ipv4.tcp_wmem=4096 16384 4194304
      - net.ipv4.tcp_rmem=4096 87380 4194304
      - net.ipv4.tcp_tw_reuse=1
      - net.ipv4.tcp_fin_timeout=5
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: '0.25' # Maksimal total CPU yang boleh dipakai (Batas Atas)

  # SERVICE SEMGREP SECURITY AUDIT (ON-DEMAND)
  semgrep:
    profiles:
      - tools
    image: returntocorp/semgrep
    container_name: semgrep_audit
    volumes:
      - ./vue:/app
    working_dir: /app
    command: >
      /bin/sh -c "
        if [ ! -d 'node_modules' ]; then
          echo '[!] Error: Direktori node_modules tidak ditemukan. Jalankan npm install terlebih dahulu.';
          exit 1;
        fi;
        echo '[+] Memulai pemindaian keamanan pada seluruh folder node_modules...';
        echo '[+] Menggunakan rule: p/security-audit';
        semgrep --config 'p/security-audit' node_modules --json --output semgrep-security-report.json;
        STATUS=$$?;
        if [ $$STATUS -eq 0 ]; then
          echo '[✓] Pemindaian selesai. Laporan tersimpan di semgrep-security-report.json';
        else
          echo '[!] Pemindaian selesai dengan temuan kerentanan atau peringatan.';
          echo '[✓] Laporan tersimpan di semgrep-security-report.json';
        fi
      "
    restart: "no"

volumes:
  go-compiler-cache:
  go-modules-cache:
  mssql_data:
